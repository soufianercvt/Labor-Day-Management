// المصدر الوحيد والموثوق للبيانات هو IndexedDB (عبر Dexie.js) في هذا المتصفح

    // فحص فعلي: محاولة كتابة وقراءة تجريبية للتأكد أن التخزين يعمل فعلاً
    // (بعض المتصفحات/أوضاع التصفح الخاص لا ترمي خطأ عند الإنشاء لكنها تفشل عند الاستخدام الفعلي)
    await db.kv.put({ key: '__healthcheck__', value: '1' });
    await db.kv.delete('__healthcheck__');
    dbReady = true;
  }catch(e){
    console.error('تعذّر تهيئة IndexedDB عبر Dexie', e);
    dbReady = false;
  }
}

const localDB = {
  async get(key){
    if(!dbReady) throw new Error('DB not ready');
    const row = await db.kv.get(key);
    if(!row) throw new Error('key not found: ' + key);
    return { key, value: row.value };
  },
  async set(key, value){
    if(!dbReady) return null;
    try{ await db.kv.put({ key, value }); return { key, value }; }
    catch(e){ console.error('Dexie set error', e); return null; }
  },
  async delete(key){
    if(!dbReady) return null;
    try{ await db.kv.delete(key); return { key, deleted: true }; }
    catch(e){ return null; }
  }
};

// ---------- اللقطات اليومية التلقائية (Snapshots) ----------
async function ensureDailySnapshot(){
  if(!dbReady || !db.snapshots) return;
  try{
    const today = todayStr();
    const existing = await db.snapshots.get(today);
    if(!existing){
      // لقطة اليوم تُلتقط أول مرة يُفتح فيها البرنامج في هذا اليوم، فتمثل حالة البيانات "كما كانت في بداية اليوم"
      await db.snapshots.put({
        date: today,
        workers: JSON.parse(JSON.stringify(workers)),
        leaves: JSON.parse(JSON.stringify(leaves)),
        settings: JSON.parse(JSON.stringify(settings)),
        savedAt: Date.now()
      });
      // تنظيف اللقطات الأقدم من 30 يوماً
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - 30);
      const cutoffStr = cutoffDate.toISOString().slice(0,10);
      const all = await db.snapshots.toArray();
      for(const s of all){
        if(s.date < cutoffStr) await db.snapshots.delete(s.date);
      }
    }
  }catch(e){ console.error('تعذّر إنشاء اللقطة اليومية', e); }
}
async function getAllSnapshots(){
  if(!dbReady || !db.snapshots) return [];
  try{ return (await db.snapshots.orderBy('date').reverse().toArray()); }
  catch(e){ return []; }
}
async function restoreFromSnapshot(date){
  if(!dbReady || !db.snapshots) return;
  const snap = await db.snapshots.get(date);
  if(!snap) return;
  workers = snap.workers;
  leaves = snap.leaves;
  settings = { ...DEFAULT_SETTINGS, ...(snap.settings || {}) };
  await saveWorkers();
  await saveLeaves();
  await saveSettings();
  await logAudit('backup_restore', `استعادة لقطة يومية بتاريخ ${date}`);
  render();
}

async function loadData(){
  // IndexedDB هو المصدر الوحيد الموثوق دائماً عند توفره
  try{
    const w = await localDB.get('workers');
    workers = JSON.parse(w.value);
  }catch(e){ workers = null; }
  try{
    const l = await localDB.get('leaves');
    leaves = JSON.parse(l.value);
  }catch(e){ leaves = null; }
  try{
    const s = await localDB.get('settings');
    settings = { ...DEFAULT_SETTINGS, ...JSON.parse(s.value) };
  }catch(e){ settings = null; }

  // إن كانت قاعدة IndexedDB فارغة تماماً (أول فتح لهذا الملف على هذا الجهاز)
  // نستخدم البذرة المضمّنة داخل الملف كنقطة انطلاق لمرة واحدة فقط
  if(workers === null && leaves === null && settings === null){
    const seed = getEmbeddedSeed();
    workers = Array.isArray(seed.workers) ? seed.workers : [];
    leaves = Array.isArray(seed.leaves) ? seed.leaves : [];
    settings = { ...DEFAULT_SETTINGS, ...(seed.settings || {}) };
  } else {
    workers = workers || [];
    leaves = leaves || [];
    settings = settings || { ...DEFAULT_SETTINGS };
  }
  if(workers.length === 0){
    workers = SEED_WORKERS.map(w => ({
      id: uid(), name: w.name, position: w.position, hireDate: '', workingHours: '', annualBalance: DEFAULT_ANNUAL_BALANCE
    }));
  }
  await saveWorkers();
  await saveLeaves();
  await saveSettings();
  await initAuditLog();

  try{
    const dw = await localDB.get('deletedWorkers');
    deletedWorkers = JSON.parse(dw.value);
  }catch(e){ deletedWorkers = []; }
  const cutoff = Date.now() - 30*24*60*60*1000;
  const beforePurge = deletedWorkers.length;
  deletedWorkers = deletedWorkers.filter(d => d.deletedAt >= cutoff);
  if(deletedWorkers.length !== beforePurge) await saveDeletedWorkers();

  try{
    const th = await localDB.get('theme');
    currentTheme = JSON.parse(th.value) || 'light';
  }catch(e){ currentTheme = 'light'; }
  applyTheme(currentTheme);

  try{
    const lb = await localDB.get('lastBackupAt');
    lastBackupAt = JSON.parse(lb.value);
  }catch(e){ lastBackupAt = null; }

  render();
}

function daysBetween(start, end){
  const s = new Date(start), e = new Date(end);
  const diff = Math.round((e - s) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}
function isOnLeaveToday(workerId){
  const t = todayStr();
  return leaves.some(l => l.workerId === workerId && l.startDate <= t && l.endDate >= t);
}
function currentLeaveOf(workerId){
  const t = todayStr();
  return leaves.find(l => l.workerId === workerId && l.startDate <= t && l.endDate >= t) || null;
}
function usedAnnualDays(workerId){
  return leaves.filter(l => l.workerId === workerId && l.type === 'annual')
               .reduce((sum,l) => sum + l.days, 0);
}
function remainingBalance(worker){
  return worker.annualBalance - usedAnnualDays(worker.id);
}
function nextLeaveOf(workerId){
  const t = todayStr();
  return leaves.filter(l => l.workerId === workerId && l.startDate > t)
               .sort((a,b) => a.startDate.localeCompare(b.startDate))[0] || null;
}
function lastLeaveOf(workerId){
  const t = todayStr();
  return leaves.filter(l => l.workerId === workerId && l.endDate < t)
               .sort((a,b) => b.endDate.localeCompare(a.endDate))[0] || null;
}
function initials(name){
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0] || '') + (parts[1]?.[0] || '');
}

function renderWorkerList(){
  const q = (document.getElementById('search').value || '').trim();
  const list = document.getElementById('workerList');
  let filtered = workers.filter(w => w.name.includes(q));
  if(advFilter.position) filtered = filtered.filter(w => (w.position||'') === advFilter.position);
  if(advFilter.status === 'present') filtered = filtered.filter(w => !isOnLeaveToday(w.id));
  if(advFilter.status === 'leave') filtered = filtered.filter(w => isOnLeaveToday(w.id));
  if(statFilter === 'leave') filtered = filtered.filter(w => isOnLeaveToday(w.id));
  filtered = filtered.slice();
  switch(advFilter.sort){
    case 'balance_asc': filtered.sort((a,b) => remainingBalance(a) - remainingBalance(b)); break;
    case 'balance_desc': filtered.sort((a,b) => remainingBalance(b) - remainingBalance(a)); break;
    case 'hire_asc': filtered.sort((a,b) => (a.hireDate||'9999').localeCompare(b.hireDate||'9999')); break;
    case 'hire_desc': filtered.sort((a,b) => (b.hireDate||'').localeCompare(a.hireDate||'')); break;
    default: filtered.sort((a,b) => a.name.localeCompare(b.name, 'ar'));
  }
  if(filtered.length === 0){
    list.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);text-align:center;padding:20px 0;">لا يوجد عمال مطابقون للتصفية الحالية.</p>`;

    if(rem <= 0){ badgeClass='badge-out'; badgeText='الرصيد منتهٍ'; }
    else if(rem <= 5){ badgeClass='badge-low'; badgeText=rem+' أيام متبقية'; }
    const curLeave = currentLeaveOf(w.id);

      ? `<span class="w-status status-leave">🟠 في عطلة (${(LEAVE_TYPES[curLeave.type]||{}).label||curLeave.type}) — يعود ${formatDMY(addDaysToDateStr(curLeave.endDate,1))}</span>`
      : `<span class="w-status status-present">🟢 حاضر اليوم</span>`;
    return `
    <div class="worker-item ${w.id===activeWorkerId?'active':''} ${curLeave?'on-leave':''}" data-id="${w.id}">
      <div class="w-avatar">${initials(w.name)}</div>

        <b>${escapeHtml(w.name)}</b>
        <span>${escapeHtml(w.position || '—')}</span>

      <div class="worker-quick-actions">
        <button type="button" data-quick-edit="${w.id}" title="تعديل البيانات">✏️</button>
        <button type="button" data-quick-leave="${w.id}" title="إضافة عطلة سريعة">➕</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.worker-item').forEach(el => {
    el.addEventListener('click', () => { activeWorkerId = el.dataset.id; render(); });
  });
  list.querySelectorAll('[data-quick-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const w = workers.find(x => x.id === btn.dataset.quickEdit);
      if(w) openWorkerModal(w);
    });
  });
  list.querySelectorAll('[data-quick-leave]').forEach(btn => {

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const statusBannerHtml = curLeave

    : `<div class="status-banner sb-present">🟢 على رأس عمله اليوم</div>`;
  let extraLeaveInfoHtml = '';
  if(!curLeave){
    const nxt = nextLeaveOf(worker.id);
    if(nxt){
      extraLeaveInfoHtml = `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">📅 العطلة القادمة: ${(LEAVE_TYPES[nxt.type]||{}).label||nxt.type} من ${formatDMY(nxt.startDate)} إلى ${formatDMY(nxt.endDate)}</p>`;
    } else {
      const lst = lastLeaveOf(worker.id);
      extraLeaveInfoHtml = lst
        ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">🕓 آخر عطلة: ${(LEAVE_TYPES[lst.type]||{}).label||lst.type} انتهت بتاريخ ${formatDMY(lst.endDate)}</p>`
        : `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">لا توجد عطل سابقة أو قادمة مسجلة.</p>`;
    }
  }

  detail.innerHTML = `
    <div class="worker-head">
      <div class="worker-title">
        <div class="w-avatar">${initials(worker.name)}</div>
        <div>
          <h2>${escapeHtml(worker.name)}</h2>
          <p>${escapeHtml(worker.position || '—')} · التوظيف: ${worker.hireDate || '—'}</p>
        </div>
      </div>
      <div class="head-actions">
        <button id="btnEditWorker">تعديل البيانات</button>
        <button class="danger" id="btnDeleteWorker">حذف العامل</button>
      </div>
    </div>

    ${statusBannerHtml}
    ${extraLeaveInfoHtml}

    <div class="balance-strip">
      <div class="b-card">
        <span>الرصيد السنوي</span>
        <b>${worker.annualBalance} يوم</b>
      </div>
      <div class="b-card">
        <span>الأيام المستخدمة</span>
        <b>${used} يوم</b>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="b-card">
        <span>الرصيد المتبقي</span>
        <b style="color:${rem<=0?'var(--red)':rem<=5?'var(--amber-deep)':'var(--green-deep)'}">${rem} يوم</b>
      </div>
    </div>

    <div class="section-title">
      <span>تسجيل عطلة جديدة</span>
    </div>
    <form class="form-grid" id="leaveForm">
      <div>
        <label>نوع العطلة</label>
        <select id="lvType">
          ${Object.entries(LEAVE_TYPES).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>تاريخ البداية</label>
        <input type="date" id="lvStart" value="${todayStr()}">
      </div>
      <div>
        <label>تاريخ النهاية</label>
        <input type="date" id="lvEnd" value="${todayStr()}">
      </div>
      <div>
        <label>عدد الأيام</label>
        <input type="text" id="lvDaysDisplay" disabled value="1">
      </div>
      <div>
        <label>اسم ولقب المستخلف (اختياري)</label>
        <input type="text" id="lvSubName" placeholder="لملء نموذج طلب العطلة">
      </div>
      <div>
        <label>رتبة المستخلف (اختياري)</label>
        <input type="text" id="lvSubPosition">
      </div>
      <div class="full">
        <label>العنوان أثناء العطلة (اختياري)</label>
        <input type="text" id="lvAddress">
      </div>
      <div class="full" id="lvCertWrap" style="display:none;">
        <label>رقم/تاريخ الشهادة الطبية (اختياري)</label>
        <input type="text" id="lvCertRef" placeholder="مثال: شهادة رقم 123 بتاريخ 2026/08/20">
      </div>
      <div class="full">
        <label>ملاحظات (اختياري)</label>
        <input type="text" id="lvNote" placeholder="سبب العطلة أو أي تفاصيل إضافية">
      </div>
      <div class="full error-msg hidden" id="lvError"></div>
      <div class="full form-actions">
        <button type="submit" class="primary">تسجيل العطلة</button>
      </div>
    </form>

    <div class="section-title">
      <span>سجل العطل (${workerLeaves.length})</span>
    </div>
    <input type="text" id="leaveHistorySearch" placeholder="بحث في سجل العطل (نوع العطلة، ملاحظة، تاريخ...)" style="margin-bottom:10px;">
    <div id="leaveHistory"></div>
  `;

  function renderLeaveHistoryList(){
    const q = (document.getElementById('leaveHistorySearch').value || '').trim().toLowerCase();
    const filteredLeaves = !q ? workerLeaves : workerLeaves.filter(l => {
      const t = LEAVE_TYPES[l.type] || LEAVE_TYPES.other;
      const haystack = `${t.label} ${l.note||''} ${l.startDate} ${l.endDate} ${formatDMY(l.startDate)} ${formatDMY(l.endDate)}`.toLowerCase();
      return haystack.includes(q);
    });
    const historyEl = document.getElementById('leaveHistory');
    historyEl.innerHTML = filteredLeaves.length === 0
      ? `<p style="font-size:13px;color:var(--ink-soft);">${workerLeaves.length===0 ? 'لا توجد عطل مسجلة لهذا العامل بعد.' : 'لا توجد نتائج مطابقة للبحث.'}</p>`
      : filteredLeaves.map(l => {
          const t = LEAVE_TYPES[l.type] || LEAVE_TYPES.other;
          return `
          <div class="leave-label">
            <div class="tag ${t.tag}">${t.label}</div>
            <div class="leave-top">
              <span class="leave-dates">${l.startDate} → ${l.endDate}</span>
              <span class="leave-days">${l.days} يوم</span>
            </div>
            ${l.note ? `<div class="leave-note">${escapeHtml(l.note)}</div>` : ''}
            ${l.certificateRef ? `<div class="leave-note">📄 الشهادة الطبية: ${escapeHtml(l.certificateRef)}</div>` : ''}
            <div class="leave-actions">
              <button data-print-id="${l.id}">🖨 طباعة طلب العطلة</button>
              <button data-print-resume-id="${l.id}">🖨 طباعة استئناف العمل</button>
              <button data-duplicate-id="${l.id}">📋 نسخ كعطلة جديدة</button>
              <button class="danger" data-leave-id="${l.id}">حذف</button>
            </div>
          </div>`;
        }).join('');
    wireLeaveHistoryButtons();
  }
  document.getElementById('leaveHistorySearch').addEventListener('input', renderLeaveHistoryList);
  renderLeaveHistoryList();

  const startInput = document.getElementById('lvStart');
  const endInput = document.getElementById('lvEnd');
  const daysDisplay = document.getElementById('lvDaysDisplay');
  const typeSelect = document.getElementById('lvType');
  const certWrap = document.getElementById('lvCertWrap');
  function updateDays(){
    const d = daysBetween(startInput.value, endInput.value);
    daysDisplay.value = d > 0 ? d : 0;
  }
  function updateCertVisibility(){
    certWrap.style.display = typeSelect.value === 'sick' ? '' : 'none';
  }
  startInput.addEventListener('change', updateDays);
  endInput.addEventListener('change', updateDays);
  typeSelect.addEventListener('change', updateCertVisibility);
  updateDays();
  updateCertVisibility();

  document.getElementById('leaveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('lvError');
    errEl.classList.add('hidden');
    const type = document.getElementById('lvType').value;
    const start = startInput.value;
    const end = endInput.value;
    const note = document.getElementById('lvNote').value.trim();
    const certificateRef = document.getElementById('lvCertRef').value.trim();
    const substituteName = document.getElementById('lvSubName').value.trim();
    const substitutePosition = document.getElementById('lvSubPosition').value.trim();
    const address = document.getElementById('lvAddress').value.trim();
    const days = daysBetween(start, end);
    if(!start || !end){
      errEl.textContent = 'يرجى تحديد تاريخ البداية والنهاية.';
      errEl.classList.remove('hidden');
      return;
    }
    if(days <= 0){
      errEl.textContent = 'تاريخ النهاية يجب أن يكون بعد تاريخ البداية أو يساويه.';
      errEl.classList.remove('hidden');
      return;
    }
    // تحذير المهلة النظامية: العطلة تُقدَّم 10 أيام قبل تاريخ الذهاب (لا ينطبق على المرضية والاستثنائية)
    if(type !== 'sick' && type !== 'exceptional'){
      const noticeDays = Math.floor((new Date(start) - new Date(todayStr())) / 86400000);
      if(noticeDays < 10){
        const ok = confirm(`تنبيه: طلب العطلة يجب أن يُقدَّم 10 أيام على الأقل قبل تاريخ الذهاب (المهلة المتبقية حالياً: ${Math.max(noticeDays,0)} يوماً فقط).\nهل تريد المتابعة رغم ذلك؟`);
        if(!ok) return;
      }
    }
    // تحقق من تعارض هذه الفترة مع عطلة أخرى مسجّلة مسبقاً لنفس العامل
    const conflict = leaves.find(l => l.workerId === worker.id && start <= l.endDate && l.startDate <= end);
    if(conflict){
      const ok = confirm(`تنبيه: توجد عطلة أخرى مسجّلة لهذا العامل تتداخل مع هذه الفترة (من ${formatDMY(conflict.startDate)} إلى ${formatDMY(conflict.endDate)}).\nهل تريد المتابعة رغم ذلك؟`);
      if(!ok) return;
    }
    // تحذير عند تجاوز الرصيد السنوي المتبقي (للعطلة السنوية فقط)
    if(type === 'annual'){
      const rem = remainingBalance(worker);
      if(days > rem){
        const ok = confirm(`تنبيه: رصيد العامل المتبقي هو ${rem} يوماً فقط، وهذه العطلة تتطلب ${days} يوماً (سيصبح الرصيد سالباً).\nهل تريد المتابعة رغم ذلك؟`);
        if(!ok) return;
      }
    }
    leaves.push({ id: uid(), workerId: worker.id, type, startDate: start, endDate: end, days, note, certificateRef, substituteName, substitutePosition, address, createdAt: Date.now() });
    await saveLeaves();
    await logAudit('leave_add', `تسجيل عطلة (${(LEAVE_TYPES[type]||{}).label||type}) للعامل "${worker.name}" من ${start} إلى ${end} (${days} يوم)`);
    render();
  });

  function wireLeaveHistoryButtons(){
    document.getElementById('leaveHistory').querySelectorAll('[data-print-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const leave = leaves.find(l => l.id === btn.dataset.printId);
        if(leave) printLeaveRequest(leave, worker);
      });
    });
    document.getElementById('leaveHistory').querySelectorAll('[data-print-resume-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const leave = leaves.find(l => l.id === btn.dataset.printResumeId);
        if(leave) printResumptionRequest(leave, worker);
      });
    });
    document.getElementById('leaveHistory').querySelectorAll('[data-duplicate-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const leave = leaves.find(l => l.id === btn.dataset.duplicateId);
        if(!leave) return;
        document.getElementById('lvType').value = leave.type;
        updateCertVisibility();
        document.getElementById('lvSubName').value = leave.substituteName || '';
        document.getElementById('lvSubPosition').value = leave.substitutePosition || '';
        document.getElementById('lvAddress').value = leave.address || '';
        document.getElementById('lvStart').value = '';
        document.getElementById('lvEnd').value = '';
        document.getElementById('lvNote').value = '';
        document.getElementById('leaveForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(() => document.getElementById('lvStart').focus(), 300);
      });
    });
    document.getElementById('leaveHistory').querySelectorAll('[data-leave-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const lv = leaves.find(l => l.id === btn.dataset.leaveId);
        leaves = leaves.filter(l => l.id !== btn.dataset.leaveId);
        await saveLeaves();
        if(lv) await logAudit('leave_delete', `حذف عطلة (${(LEAVE_TYPES[lv.type]||{}).label||lv.type}) للعامل "${worker.name}" من ${lv.startDate} إلى ${lv.endDate}`);
        render();
      });
    });
  }

  document.getElementById('btnEditWorker').addEventListener('click', () => openWorkerModal(worker));
  document.getElementById('btnDeleteWorker').addEventListener('click', () => openDeleteConfirm(worker));
}

function openWorkerModal(worker){
  const isEdit = !!worker;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>${isEdit ? 'تعديل بيانات العامل' : 'إضافة عامل جديد'}</h3>
        <form id="workerForm">
          <label>الاسم الكامل</label>
          <input id="wfName" type="text" value="${isEdit ? escapeHtml(worker.name) : ''}" style="margin-bottom:12px;">
          <label>المنصب</label>
          <input id="wfPosition" type="text" value="${isEdit ? escapeHtml(worker.position||'') : ''}" placeholder="صيدلي، مساعد صيدلي..." style="margin-bottom:12px;">
          <label>تاريخ التوظيف</label>
          <input id="wfHireDate" type="date" value="${isEdit ? (worker.hireDate||'') : ''}" style="margin-bottom:12px;">
          <label>توقيت العمل الخاص بهذا العامل (اختياري)</label>
          <input id="wfHours" type="text" value="${isEdit ? escapeHtml(worker.workingHours||'') : ''}" placeholder="${escapeHtml(settings.workingHours)}" style="margin-bottom:4px;">
          <p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 12px;">اتركه فارغاً لاستخدام توقيت العمل الافتراضي من الإعدادات.</p>
          <label>الرصيد السنوي (بالأيام)</label>
          <input id="wfBalance" type="number" min="0" value="${isEdit ? worker.annualBalance : DEFAULT_ANNUAL_BALANCE}" style="margin-bottom:12px;">
          <div class="error-msg hidden" id="wfError"></div>
          <div class="form-actions">
            <button type="submit" class="primary">${isEdit ? 'حفظ التعديلات' : 'إضافة العامل'}</button>
            <button type="button" id="wfCancel">إلغاء</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('workerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('wfName').value.trim();
    const position = document.getElementById('wfPosition').value.trim();
    const hireDate = document.getElementById('wfHireDate').value;
    const workingHours = document.getElementById('wfHours').value.trim();
    const balance = parseFloat(document.getElementById('wfBalance').value);
    const errEl = document.getElementById('wfError');
    if(!name){
      errEl.textContent = 'يرجى إدخال اسم العامل.';
      errEl.classList.remove('hidden');
      return;
    }
    const normalize = s => s.trim().replace(/\s+/g,' ').toLowerCase();
    const dup = workers.find(w => (!isEdit || w.id !== worker.id) && normalize(w.name) === normalize(name));
    if(dup){
      const ok = confirm(`يوجد بالفعل عامل بنفس الاسم "${dup.name}" (${dup.position||'بدون منصب'}).\nهل تريد المتابعة وإضافته كعامل مستقل رغم ذلك؟`);
      if(!ok) return;
    }
    if(isNaN(balance) || balance < 0){
      errEl.textContent = 'يرجى إدخال رصيد سنوي صحيح.';
      errEl.classList.remove('hidden');
      return;
    }
    if(isEdit){
      worker.name = name; worker.position = position; worker.hireDate = hireDate; worker.workingHours = workingHours; worker.annualBalance = balance;
    } else {
      const w = { id: uid(), name, position, hireDate, workingHours, annualBalance: balance };
      workers.push(w);
      activeWorkerId = w.id;
    }
    await saveWorkers();
    await logAudit(isEdit ? 'worker_edit' : 'worker_add', isEdit ? `تعديل بيانات العامل "${name}"` : `إضافة عامل جديد "${name}"`);
    closeModal();
    render();
  });
}

function openDeleteConfirm(worker){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>حذف العامل</h3>
        <p style="font-size:14px;color:var(--ink-soft);margin-bottom:18px;">
          هل أنت متأكد من حذف "${escapeHtml(worker.name)}"؟ سيُنقل مع سجلات عطله إلى سلة المحذوفات، ويمكن استرجاعه خلال 30 يوماً من "🗄 إدارة البيانات ← سلة المحذوفات". بعد 30 يوماً يُحذف نهائياً تلقائياً.
        </p>
        <div class="form-actions">
          <button class="danger" id="confirmDelete">نقل إلى سلة المحذوفات</button>
          <button id="wfCancel">إلغاء</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('confirmDelete').addEventListener('click', async () => {
    const workerLeaves = leaves.filter(l => l.workerId === worker.id);
    deletedWorkers.push({ worker, leaves: workerLeaves, deletedAt: Date.now() });
    workers = workers.filter(w => w.id !== worker.id);
    leaves = leaves.filter(l => l.workerId !== worker.id);
    activeWorkerId = null;
    await saveWorkers();
    await saveLeaves();
    await saveDeletedWorkers();
    await logAudit('worker_delete', `نقل العامل "${worker.name}" وسجلات عطله إلى سلة المحذوفات`);
    closeModal();
    render();
  });
}

async function restoreDeletedWorker(deletedAt){
  const entry = deletedWorkers.find(d => d.deletedAt === deletedAt);
  if(!entry) return;
  workers.push(entry.worker);
  leaves = leaves.concat(entry.leaves || []);
  deletedWorkers = deletedWorkers.filter(d => d.deletedAt !== deletedAt);
  await saveWorkers();
  await saveLeaves();
  await saveDeletedWorkers();
  await logAudit('worker_restore', `استرجاع العامل "${entry.worker.name}" من سلة المحذوفات`);
  render();
}
async function purgeDeletedWorker(deletedAt){
  deletedWorkers = deletedWorkers.filter(d => d.deletedAt !== deletedAt);
  await saveDeletedWorkers();
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    const root = document.getElementById('modalRoot');
    if(root && root.innerHTML.trim() !== '') closeModal();
  }
});
// تركيز تلقائي على أول حقل قابل للتعبئة داخل أي نافذة منبثقة تُفتح، لتحسين إمكانية الوصول والتنقل بلوحة المفاتيح
const modalObserver = new MutationObserver(() => {
  const modal = document.querySelector('.modal');
  if(modal){
    const focusable = modal.querySelector('input:not([type=hidden]), select, textarea, button');
    if(focusable) setTimeout(() => focusable.focus(), 30);
  }
});
modalObserver.observe(document.getElementById('modalRoot'), { childList: true, subtree: true });

function openSettingsModal(){

      <div class="modal">
        <h3>إعدادات النماذج الرسمية</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;">تُستخدم هذه البيانات لملء ترويسة نموذج طلب العطلة وجدول عمل المصلحة عند الطباعة.</p>

          <label>ملاحظة الحضور الافتراضية (لكل عامل غير في عطلة)</label>
          <input id="stAttendance" type="text" value="${escapeHtml(settings.attendanceNote)}" style="margin-bottom:12px;">
          <label>لغة الطباعة</label>
          <select id="stPrintLang" style="margin-bottom:12px;">
            <option value="ar" ${settings.printLanguage!=='fr'?'selected':''}>العربية</option>
            <option value="fr" ${settings.printLanguage==='fr'?'selected':''}>Français</option>
          </select>
          <label>شعار المؤسسة (اختياري، يظهر أعلى النماذج المطبوعة)</label>
          <input id="stLogo" type="file" accept="image/*" style="margin-bottom:6px;">
          ${settings.logoDataUrl ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><img src="${settings.logoDataUrl}" style="height:40px;border-radius:6px;border:1px solid var(--line);"><button type="button" id="stLogoRemove" style="font-size:12px;padding:5px 10px;">إزالة الشعار</button></div>` : ''}
          <div class="form-actions">
            <button type="submit" class="primary">حفظ</button>
            <button type="button" id="wfCancel">إلغاء</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  let pendingLogoDataUrl = settings.logoDataUrl || null;
  let logoRemoved = false;
  document.getElementById('stLogo').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 800*1024){
      alert('يرجى اختيار صورة أصغر من 800 كيلوبايت.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { pendingLogoDataUrl = reader.result; logoRemoved = false; };
    reader.readAsDataURL(file);
  });
  const removeBtn = document.getElementById('stLogoRemove');
  if(removeBtn){

function formatDMY(dateStr){
  if(!dateStr) return '..............';
  const d = new Date(dateStr + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function formatDMYFr(dateStr){
  if(!dateStr) return '..............';
  return formatDMY(dateStr); // نفس صيغة يوم/شهر/سنة صالحة للفرنسية أيضاً
}

function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function monthRangeStr(year, month){
  const mm = String(month).padStart(2,'0');
  const start = `${year}-${mm}-01`;
  const end = `${year}-${mm}-${String(daysInMonth(year,month)).padStart(2,'0')}`;
  return { start, end };
}

function scheduleNoteForWorker(workerId, year, month){
  const { start, end } = monthRangeStr(year, month);
  const overlapping = leaves.filter(l => l.workerId === workerId && l.startDate <= end && l.endDate >= start)
                             .sort((a,b) => a.startDate.localeCompare(b.startDate));
  if(overlapping.length === 0) return '';
  const mName = ALGERIAN_MONTHS[month-1];
  return overlapping.map(l => {
    const t = (LEAVE_TYPES[l.type] && LEAVE_TYPES[l.type].label) || 'استثنائية';
    const startsInMonth = l.startDate >= start;
    const endsInMonth = l.endDate <= end;
    const sDay = parseInt(l.startDate.slice(8,10), 10);
    const eDay = parseInt(l.endDate.slice(8,10), 10);
    if(startsInMonth && endsInMonth) return `عطلة ${t} من ${sDay} إلى ${eDay} ${mName}`;
    if(startsInMonth && !endsInMonth) return `عطلة ${t} ابتداءً من ${sDay} ${mName}`;
    if(!startsInMonth && endsInMonth) return `عطلة ${t} إلى غاية ${eDay} ${mName}`;
    return `عطلة ${t} طيلة الشهر`;
  }).join(' — ');
}

// ---------- جدول المناوبة (الجمعة والسبت) ----------
function getWeekendDatesInMonth(year, month){
  const n = daysInMonth(year, month);
  const dates = [];
  for(let d = 1; d <= n; d++){
    const wd = new Date(year, month - 1, d).getDay(); // 0=Sunday ... 5=Friday, 6=Saturday
    if(wd === 5 || wd === 6){
      dates.push({ day: d, label: wd === 5 ? 'الجمعة' : 'السبت' });
    }
  }
  return dates;
}

function buildDutyDatesFields(year, month){
  const dates = getWeekendDatesInMonth(year, month);
  if(dates.length === 0){
    return '<p style="font-size:13px;color:var(--ink-soft);margin:4px 0;">لا توجد أيام جمعة أو سبت ضمن هذا الشهر.</p>';
  }
  if(workers.length === 0){
    return '<p style="font-size:13px;color:var(--ink-soft);margin:4px 0;">لا يوجد عمال مسجلون.</p>';
  }
  return dates.map(d => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <span style="flex:0 0 110px;font-size:12.5px;">${d.day} (${d.label})</span>
      <select class="duty-day-select" data-day="${d.day}" style="flex:1;padding:6px 8px;font-size:12.5px;">
        <option value="">-- بدون تعيين --</option>
        ${workers.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}
      </select>
    </div>`).join('');
}

// ---------- التنبيهات ----------
function computeNotifications(){
  const notifs = [];
  const t = todayStr();
  const in7 = addDaysToDateStr(t, 7);
  leaves.forEach(l => {
    if(l.startDate > t && l.startDate <= in7){
      const w = workers.find(x => x.id === l.workerId);
      if(w){
        notifs.push({ type: 'upcoming', text: `عطلة ${(LEAVE_TYPES[l.type]||{}).label||l.type} للعامل "${w.name}" تبدأ بتاريخ ${formatDMY(l.startDate)}` });
      }
    }
  });
  for(let i=0;i<leaves.length;i++){
    for(let j=i+1;j<leaves.length;j++){
      const a = leaves[i], b = leaves[j];
      if(a.workerId === b.workerId) continue;
      const wa = workers.find(x=>x.id===a.workerId);
      const wb = workers.find(x=>x.id===b.workerId);
      if(!wa || !wb || !wa.position || wa.position !== wb.position) continue;
      if(a.startDate <= b.endDate && b.startDate <= a.endDate){
        notifs.push({ type: 'overlap', text: `تداخل عطل: "${wa.name}" و"${wb.name}" (${wa.position}) في نفس الفترة` });
      }
    }
  }
  const twoWeeksMs = 14*24*60*60*1000;
  if(!lastBackupAt || (Date.now() - lastBackupAt) > twoWeeksMs){
    const daysSince = lastBackupAt ? Math.floor((Date.now()-lastBackupAt)/86400000) : null;
    notifs.push({
      type: 'backup',
      text: lastBackupAt
        ? `لم تُصدَّر نسخة احتياطية منذ ${daysSince} يوماً. يُفضّل أخذ نسخة احتياطية دورياً من "🗄 إدارة البيانات".`
        : `لم تُصدَّر أي نسخة احتياطية بعد. يُفضّل أخذ نسخة احتياطية من "🗄 إدارة البيانات".`
    });
  }
  return notifs;
}
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const n = computeNotifications();
  if(n.length === 0){ badge.classList.add('hidden'); }
  else{ badge.textContent = n.length > 9 ? '9+' : String(n.length); badge.classList.remove('hidden'); }
}

  const notifs = computeNotifications();

let calState = null; // { year, month }
function openCalendarModal(year, month){
  const now = new Date();
  if(!calState) calState = { year: year || now.getFullYear(), month: month || (now.getMonth()+1) };
  else if(year && month) calState = { year, month };
  renderCalendarModal();
}
function renderCalendarModal(){
  const { year, month } = calState;
  const mName = ALGERIAN_MONTHS[month-1];
  const nDays = daysInMonth(year, month);
  const firstWeekday = new Date(year, month-1, 1).getDay(); // 0=الأحد
  const dayNames = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const t = todayStr();

  let cellsHtml = '';
  for(let i=0;i<firstWeekday;i++) cellsHtml += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=nDays; d++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const onLeave = leaves.filter(l => l.startDate <= dateStr && l.endDate >= dateStr);
    const names = onLeave.map(l => {
      const w = workers.find(x => x.id === l.workerId);
      return w ? escapeHtml(w.name.split(' ')[0]) : '';
    }).filter(Boolean);
    const isToday = dateStr === t ? 'cal-today' : '';
    cellsHtml += `
      <div class="cal-cell ${isToday}" title="${names.join('، ')}">
        <span class="cal-day-num">${d}</span>
        ${names.slice(0,3).map(n => `<span class="cal-chip">${n}</span>`).join('')}
        ${names.length > 3 ? `<span class="cal-chip cal-more">+${names.length-3}</span>` : ''}
      </div>`;
  }

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal" style="max-width:760px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <button type="button" id="calPrev">◀ الشهر السابق</button>
          <h3 style="margin:0;">📆 تقويم العطل — ${mName} ${year}</h3>
          <button type="button" id="calNext">الشهر التالي ▶</button>
        </div>
        <div class="cal-grid cal-head">
          ${dayNames.map(n => `<div class="cal-cell cal-headcell">${n}</div>`).join('')}
        </div>
        <div class="cal-grid">${cellsHtml}</div>
        <div class="form-actions">
          <button type="button" id="wfCancel">إغلاق</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('calPrev').addEventListener('click', () => {
    calState.month--; if(calState.month < 1){ calState.month = 12; calState.year--; }
    renderCalendarModal();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calState.month++; if(calState.month > 12){ calState.month = 1; calState.year++; }
    renderCalendarModal();
  });
}

function formatAuditTime(iso){
  try{
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');

// ---------- تنزيل ملف نصي مساعد ----------
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function toCsvValue(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCsv(headers, rows){
  const lines = [headers.map(toCsvValue).join(',')];
  rows.forEach(r => lines.push(r.map(toCsvValue).join(',')));
  return '\uFEFF' + lines.join('\r\n'); // BOM لدعم صحيح للعربية في إكسل
}

// ---------- استيراد قائمة عمال من CSV ----------
function parseCsvText(text){
  // إزالة BOM إن وُجد
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* تجاهل */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}
function pickField(headerMap, obj, keys){
  for(const k of keys){
    if(headerMap[k] !== undefined && obj[headerMap[k]] !== undefined) return obj[headerMap[k]];
  }
  return '';
}
async function handleCsvWorkersImport(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const rows = parseCsvText(text);
    if(rows.length < 2){ alert('ملف CSV فارغ أو غير صالح.'); return; }
    const headers = rows[0].map(h => h.trim());
    const idx = {};
    headers.forEach((h,i) => { idx[h] = i; });
    const nameKeys = ['الاسم واللقب','الاسم','name','Name','Full Name'];
    const posKeys = ['الرتبة','المنصب','position','Position'];
    const hireKeys = ['تاريخ التوظيف','hireDate','Hire Date'];
    const balKeys = ['الرصيد السنوي','annualBalance','Balance'];
    const hoursKeys = ['توقيت العمل','workingHours'];
    const dataRows = rows.slice(1);
    const newWorkers = dataRows.map(r => {
      const nameIdx = nameKeys.map(k => idx[k]).find(i => i !== undefined);
      const posIdx = posKeys.map(k => idx[k]).find(i => i !== undefined);
      const hireIdx = hireKeys.map(k => idx[k]).find(i => i !== undefined);
      const balIdx = balKeys.map(k => idx[k]).find(i => i !== undefined);
      const hoursIdx = hoursKeys.map(k => idx[k]).find(i => i !== undefined);
      return {
        id: uid(),
        name: (nameIdx !== undefined ? r[nameIdx] : '').trim(),
        position: (posIdx !== undefined ? r[posIdx] : '').trim(),
        hireDate: (hireIdx !== undefined ? r[hireIdx] : '').trim(),
        annualBalance: (balIdx !== undefined && r[balIdx]) ? Number(r[balIdx]) || DEFAULT_ANNUAL_BALANCE : DEFAULT_ANNUAL_BALANCE,
        workingHours: (hoursIdx !== undefined ? r[hoursIdx] : '').trim()
      };
    }).filter(w => w.name);
    if(newWorkers.length === 0){
      alert('لم يتم العثور على أي اسم عامل في الملف. تأكد أن أول عمود يحمل عنوانًا مثل "الاسم واللقب" أو "name".');
      return;
    }
    if(!confirm(`سيتم استيراد ${newWorkers.length} عامل من ملف CSV، وسيُستبدل قائمة العمال الحالية بها. هل تريد المتابعة؟`)) return;
    workers = newWorkers;
    await saveWorkers();
    await logAudit('excel_import', `استيراد ${newWorkers.length} عامل من ملف CSV`);
    closeModal();
    render();
    alert('تم استيراد قائمة العمال بنجاح.');
  }catch(err){
    console.error(err);
    alert('تعذّرت قراءة ملف CSV.');
  }
}

// ---------- فحص سلامة البيانات ----------
function runIntegrityCheck(){
  const issues = [];

  // 1) عطل يتيمة (مرتبطة بعامل غير موجود)
  leaves.forEach(l => {
    if(!workers.find(w => w.id === l.workerId)){
      issues.push({
        severity: 'error',
        text: `عطلة يتيمة: سجل عطلة (${(LEAVE_TYPES[l.type]||{}).label||l.type}) من ${l.startDate} إلى ${l.endDate} غير مرتبط بأي عامل حالي.`,
        fix: () => { leaves = leaves.filter(x => x.id !== l.id); },
        fixLabel: 'حذف السجل اليتيم'
      });
    }
  });

  // 2) أرصدة سالبة
  workers.forEach(w => {
    const rem = remainingBalance(w);
    if(rem < 0){
      issues.push({
        severity: 'warning',
        text: `رصيد سالب: العامل "${w.name}" رصيده المتبقي ${rem} يوماً (تجاوز الرصيد السنوي المسموح).`,
        fix: null
      });
    }
  });

  // 3) عطل بتاريخ نهاية قبل تاريخ البداية
  leaves.forEach(l => {
    if(l.endDate < l.startDate){
      const w = workers.find(x => x.id === l.workerId);
      issues.push({
        severity: 'error',
        text: `تاريخ غير منطقي: عطلة ${w ? 'للعامل "'+w.name+'" ' : ''}تاريخ نهايتها (${l.endDate}) قبل تاريخ بدايتها (${l.startDate}).`,
        fix: () => { leaves = leaves.filter(x => x.id !== l.id); },
        fixLabel: 'حذف هذا السجل'
      });
    }
  });

  // 4) عطل مسجّلة قبل تاريخ توظيف العامل
  workers.forEach(w => {
    if(!w.hireDate) return;
    leaves.filter(l => l.workerId === w.id && l.startDate < w.hireDate).forEach(l => {
      issues.push({
        severity: 'warning',
        text: `عطلة سابقة للتوظيف: عطلة العامل "${w.name}" تبدأ بتاريخ ${l.startDate}، قبل تاريخ توظيفه (${w.hireDate}).`,
        fix: null
      });
    });
  });

  // 5) عطل متطابقة تمامًا (تكرار محتمل بالخطأ)
  for(let i=0;i<leaves.length;i++){
    for(let j=i+1;j<leaves.length;j++){
      const a = leaves[i], b = leaves[j];
      if(a.workerId === b.workerId && a.startDate === b.startDate && a.endDate === b.endDate && a.type === b.type){
        const w = workers.find(x => x.id === a.workerId);
        issues.push({
          severity: 'warning',
          text: `عطلة مكررة: يوجد سجلان متطابقان تمامًا ${w ? 'للعامل "'+w.name+'" ' : ''}من ${a.startDate} إلى ${a.endDate}.`,
          fix: () => { leaves = leaves.filter(x => x.id !== b.id); },
          fixLabel: 'حذف النسخة المكررة'
        });
      }
    }
  }

  // 6) عامل بدون اسم (بيانات تالفة)
  workers.forEach(w => {
    if(!w.name || !w.name.trim()){
      issues.push({
        severity: 'error',
        text: `عامل بدون اسم (معرّف: ${w.id}).`,
        fix: null
      });
    }
  });

  return issues;
}

  root.innerHTML = `

async function handleExcelImport(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const wsWorkers = wb.Sheets['العمال'];
    if(!wsWorkers){
      alert('لم يتم العثور على ورقة باسم "العمال" في ملف Excel. تأكد من أن الملف بنفس تنسيق التصدير.');
      return;
    }
    const rows = XLSX.utils.sheet_to_json(wsWorkers, { defval: '' });
    if(rows.length === 0){
      alert('ورقة "العمال" فارغة.');
      return;
    }
    if(!confirm(`سيتم استيراد ${rows.length} عامل من ملف Excel، وسيُستبدل قائمة العمال الحالية بها. هل تريد المتابعة؟`)){
      return;
    }
    const newWorkers = rows.map(r => ({
      id: uid(),
      name: String(r['الاسم واللقب'] || '').trim(),
      position: String(r['الرتبة'] || '').trim(),
      hireDate: String(r['تاريخ التوظيف'] || '').trim(),
      annualBalance: Number(r['الرصيد السنوي']) || DEFAULT_ANNUAL_BALANCE,
      workingHours: String(r['توقيت العمل'] || '').trim()
    })).filter(w => w.name);
    workers = newWorkers;
    await saveWorkers();
    await logAudit('excel_import', `استيراد ${newWorkers.length} عامل من ملف Excel`);
    closeModal();
    render();
    alert('تم استيراد قائمة العمال بنجاح.');
  }catch(err){
    console.error(err);
    alert('تعذّرت قراءة ملف Excel. تأكد من أنه بصيغة .xlsx صحيحة.');
  }
}

// ---------- تسجيل الدخول ----------
async function hashText(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // احتياط بسيط في حال عدم توفر SubtleCrypto
    let h = 0;
    for(let i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; }
    return 'fallback_' + h;
  }
}

async function getStoredCredentials(){
  try{
    const r = await localDB.get('auth_credentials');
    authCredentials = JSON.parse(r.value);
    return authCredentials;
  }catch(e){
    // أول فتح لهذا الملف على هذا الجهاز: تحقق من البذرة المضمّنة إن وُجدت
    const seed = getEmbeddedSeed();
    if(seed && seed.auth){
      authCredentials = seed.auth;
      try{ await localDB.set('auth_credentials', JSON.stringify(seed.auth)); }catch(err){}
      return authCredentials;
    }
    // لا يوجد أي حساب مسجل بعد: إنشاء حساب افتراضي (admin / admin) تلقائياً.
    // يمكن تغيير اسم المستخدم وكلمة السر لاحقاً من داخل البرنامج عبر زر "🔑 تغيير بيانات الدخول".
    const defaultHash = await hashText('admin');
    const defaultCred = { username: 'admin', passwordHash: defaultHash };
    authCredentials = defaultCred;
    try{ await localDB.set('auth_credentials', JSON.stringify(defaultCred)); }catch(err){}
    return defaultCred;
  }
}
async function saveCredentials(cred){
  authCredentials = cred;
  try{ await localDB.set('auth_credentials', JSON.stringify(cred)); }
  catch(e){ console.error('auth storage error', e); }
}
async function deleteCredentialsLocal(){
  authCredentials = null;
  try{ await localDB.delete('auth_credentials'); }catch(e){}
}

      <p class="error-msg hidden" id="setError"></p>
      <button type="submit" class="primary">إنشاء الحساب والدخول</button>
    </form>
  `;
  document.getElementById('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('setUser').value.trim();
    const pass = document.getElementById('setPass').value;
    const pass2 = document.getElementById('setPass2').value;
    const errEl = document.getElementById('setError');
    if(!user || !pass){
      errEl.textContent = 'يرجى تعبئة جميع الحقول.';
      errEl.classList.remove('hidden');
      return;
    }
    if(pass.length < 4){
      errEl.textContent = 'يجب أن تتكون كلمة السر من 4 أحرف على الأقل.';
      errEl.classList.remove('hidden');
      return;
    }
    if(pass !== pass2){
      errEl.textContent = 'كلمتا السر غير متطابقتين.';
      errEl.classList.remove('hidden');
      return;
    }
    const passwordHash = await hashText(pass);
    await saveCredentials({ username: user, passwordHash });
    await enterApp();
  });
}

function renderLoginScreen(stored){
  const card = document.getElementById('authCard');
  card.innerHTML = `
    <h2>🔒 تسجيل الدخول</h2>
    <p class="sub">برنامج إدارة عطل عمال الصيدلية</p>
    <form id="loginForm">
      <label>اسم المستخدم</label>
      <input id="logUser" type="text" autocomplete="username" required>
      <label>كلمة السر</label>
      <input id="logPass" type="password" autocomplete="current-password" required>
      <p class="error-msg hidden" id="logError"></p>
      <button type="submit" class="primary">دخول</button>
    </form>
    <p class="auth-switch">نسيت كلمة السر؟ <a id="resetAccountLink">إعادة تعيين الحساب</a></p>
    <p style="font-size:11px;color:var(--ink-soft);text-align:center;margin-top:10px;">الحساب الافتراضي عند أول استخدام: <b>admin / admin</b> (قابل للتغيير من داخل البرنامج بعد الدخول)</p>
  `;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value;
    const errEl = document.getElementById('logError');
    const passwordHash = await hashText(pass);
    if(user !== stored.username || passwordHash !== stored.passwordHash){
      errEl.textContent = 'اسم المستخدم أو كلمة السر غير صحيحة.';
      errEl.classList.remove('hidden');
      return;
    }
    await enterApp();
  });
  document.getElementById('resetAccountLink').addEventListener('click', async () => {
    if(confirm('سيؤدي هذا إلى حذف اسم المستخدم وكلمة السر الحاليين فقط (دون التأثير على بيانات العمال والعطل)، ثم إنشاء حساب جديد. هل تريد المتابعة؟')){
      await deleteCredentialsLocal();
      renderSetupScreen();
    }
  });
}

async function enterApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  await loadData();
  await ensureDailySnapshot();
  await logAudit('login', `تسجيل دخول المستخدم "${(authCredentials && authCredentials.username) || ''}"`);
  startInactivityWatcher();
}

// ---------- إغلاق الجلسة تلقائيًا عند عدم النشاط ----------
const INACTIVITY_LIMIT_MS = 20 * 60 * 1000; // 20 دقيقة
let inactivityTimer = null;
function resetInactivityTimer(){
  if(document.getElementById('appRoot').classList.contains('hidden')) return; // لا داعي أثناء وجودنا في شاشة الدخول
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(async () => {
    if(!document.getElementById('appRoot').classList.contains('hidden')){
      await logoutApp();
      alert('تم تسجيل خروجك تلقائياً بعد 20 دقيقة من عدم النشاط، مع حفظ جميع تعديلاتك.');
    }
  }, INACTIVITY_LIMIT_MS);
}
function startInactivityWatcher(){
  ['click','keydown','mousemove','touchstart'].forEach(evt => {
    document.addEventListener(evt, resetInactivityTimer, { passive: true });
  });
  resetInactivityTimer();
}

async function logoutApp(){
  clearTimeout(inactivityTimer);
  // حفظ جميع التعديلات الحالية قبل الخروج
  await saveWorkers();
  await saveLeaves();
  await saveSettings();
  await logAudit('logout', `تسجيل خروج المستخدم "${(authCredentials && authCredentials.username) || ''}"`);
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  const stored = await getStoredCredentials();
  if(stored) renderLoginScreen(stored); else renderSetupScreen();
}

async function initAuth(){
  await initDB();
  if(!dbReady){
    showBanner('⚠️ تعذّر الوصول إلى قاعدة بيانات المتصفح (IndexedDB). لن يتم حفظ أي تعديل تجريه في هذه الجلسة! جرّب إغلاق وضع التصفح الخاص/الخفي، أو استخدام متصفح آخر (Chrome أو Edge)، أو التأكد من توفر مساحة تخزين كافية على الجهاز.', 'error', true);
  }
  initBroadcastChannel();
  const stored = await getStoredCredentials();
  if(stored) renderLoginScreen(stored); else renderSetupScreen();
}

initAuth();
</script>
