</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A22;
    --ink-soft:#4E5F55;
    --paper:#FAF6EC;
    --paper-2:#F1EADA;
    --card:#FFFFFF;
    --green:#1F4B3B;
    --green-deep:#123024;
    --green-soft:#DCE8DC;
    --amber:#C1791B;
    --amber-soft:#F6E3C4;
    --amber-deep:#7A4A0C;
    --line:#DCD4C0;
    --red:#B23A2E;
    --red-soft:#F6DEDA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    direction:rtl;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:26px;padding-bottom:18px;border-bottom:2px solid var(--green);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .rx-mark{
    width:46px;height:46px;border-radius:10px;background:var(--green);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal',sans-serif;font-weight:800;font-size:20px;flex-shrink:0;
  }
  .brand h1{
    font-family:'Tajawal',sans-serif;font-weight:800;font-size:22px;margin:0;color:var(--green-deep);
  }
  .brand p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .top-stats{display:flex;gap:10px;}
  .stat-pill{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:8px 16px;text-align:center;min-width:84px;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .stat-pill:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(20,40,30,.1);border-color:var(--green);}
  .stat-pill.active-filter{border-color:var(--green-deep);background:var(--green-soft);}
  .stat-pill b{display:block;font-size:20px;font-family:'Tajawal',sans-serif;color:var(--green-deep);}
  .stat-pill span{font-size:11px;color:var(--ink-soft);}

  .header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;}
  .btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn-group + .btn-group{padding-right:14px;border-right:1px solid var(--line);}
  @media (max-width:900px){ .btn-group + .btn-group{border-right:none;padding-right:0;} }

  .bell-btn{position:relative;padding:9px 12px;}
  .notif-badge{
    position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;
    font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row #search{margin-bottom:0;flex:1;}
  .filter-btn{padding:9px 12px;flex-shrink:0;}
  .filter-panel{
    background:var(--paper-2);border:1px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;
  }
  .filter-panel label{font-size:12px;font-weight:600;margin-bottom:-4px;}
  .filter-panel select{width:100%;}
  .filter-clear{align-self:flex-start;font-size:12px;padding:6px 10px;}

  .worker-item{position:relative;}
  .worker-quick-actions{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    display:none;gap:6px;
  }
  .worker-item:hover .worker-quick-actions{display:flex;}
  .worker-quick-actions button{
    background:var(--card);border:1px solid var(--line);border-radius:7px;
    width:28px;height:28px;font-size:13px;padding:0;cursor:pointer;
  }
  .worker-quick-actions button:hover{background:var(--green-soft);border-color:var(--green);}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .panel h2{font-family:'Tajawal',sans-serif;font-size:16px;margin:0 0 14px;color:var(--green-deep);font-weight:700;}

  #search{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:'Cairo',sans-serif;font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:12px;
  }
  #search:focus{outline:none;border-color:var(--green);}

  .worker-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;
    cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:.15s;
  }
  .worker-item:hover{background:var(--paper-2);}
  .worker-item.active{background:var(--green-soft);border-color:var(--green);}
  .w-avatar{
    width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .w-info b{display:block;font-size:14px;}
  .w-info span{font-size:12px;color:var(--ink-soft);}
  .w-status{display:block;font-size:11px;margin-top:3px;font-weight:600;}
  .status-present{color:var(--green-deep);}
  .status-leave{color:var(--amber-deep);}
  .worker-item.on-leave{background:var(--amber-soft);}
  .worker-item.on-leave:hover{background:#f0dcae;}
  .worker-item.on-leave.active{background:var(--green-soft);}
  .w-badge{
    margin-right:auto;font-size:11px;padding:3px 8px;border-radius:20px;
  }
  .badge-ok{background:var(--green-soft);color:var(--green-deep);}
  .badge-low{background:var(--amber-soft);color:var(--amber-deep);}
  .badge-out{background:var(--red-soft);color:var(--red);}

  button{
    font-family:'Cairo',sans-serif;cursor:pointer;border-radius:9px;border:1px solid var(--line);
    background:var(--card);padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:.15s;
  }
  button:hover{border-color:var(--green);color:var(--green-deep);}
  button.primary{background:var(--green);color:#fff;border-color:var(--green);}
  button.primary:hover{background:var(--green-deep);color:#fff;}
  button.danger{color:var(--red);}

<script>
// ---------- نظام التخزين (مُبسّط بعد إصلاح خلل التعارض) ----------
// المصدر الوحيد والموثوق للبيانات هو IndexedDB (عبر Dexie.js) في هذا المتصفح
// على هذا الجهاز: كل عملية إضافة/تعديل/حذف تُحفظ فيه تلقائياً وفوراً، دون
// الحاجة لأي زر "حفظ". لا حاجة لإعادة كتابة ملف الصفحة نفسه على القرص (هذه
// الطريقة كانت تسبب خللاً: عند نسيان استبدال الملف القديم بالنسخة المُنزَّلة
// الجديدة، كان البرنامج يعيد تحميل بيانات قديمة من الملف نفسه ويتجاهل
// التعديلات الأحدث المحفوظة في IndexedDB، فتبدو البيانات وكأنها "ضاعت".
//
// كتلة <script id="embeddedData"> ما تزال موجودة وتُستخدم مرة واحدة فقط:
// كبذرة أولية عند فتح الملف لأول مرة على متصفح/جهاز لم يُستخدم فيه من قبل
// (أي عندما تكون قاعدة IndexedDB فارغة تماماً). بعد ذلك لا يُعاد الاعتماد
// عليها إطلاقاً، فلا يوجد أي تعارض بين مصدرين.
//
// لنقل البيانات إلى جهاز آخر أو لأخذ نسخة احتياطية موثوقة: استخدم زر
// "🗄 إدارة البيانات" ← "⬇ تصدير نسخة احتياطية (JSON)"، ثم "⬆ استعادة" على
// الجهاز الآخر. هذه هي الطريقة الفعالة والمضمونة لنقل البيانات، بخلاف
// الاعتماد على نسخ ملف HTML يدوياً.
let db = null;
let dbReady = false;
function initDB(){
  try{
    db = new Dexie('PharmacyLeaveDB');
    db.version(1).stores({
      kv: 'key',
      auditLog: '++id, timestamp'
    });
    dbReady = true;
  }catch(e){
    console.error('تعذّر تهيئة IndexedDB عبر Dexie', e);
    dbReady = false;
  }
}
initDB();

const localDB = {
  async get(key){
    if(!dbReady) throw new Error('DB not ready');
    const row = await db.kv.get(key);
    if(!row) throw new Error('key not found: ' + key);
    return { key, value: row.value };
  },
  async set(key, value){
    if(!dbReady) return null;
    try{ await db.kv.put({ key, value }); return { key, value }; }
    catch(e){ console.error('Dexie set error', e); return null; }
  },
  async delete(key){
    if(!dbReady) return null;
    try{ await db.kv.delete(key); return { key, deleted: true }; }
    catch(e){ return null; }
  }
};

function getEmbeddedSeed(){
  try{
    const el = document.getElementById('embeddedData');
    const parsed = JSON.parse((el && el.textContent) || '{}');
    return (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){ return {}; }
}

// ---------- مؤشر حالة الحفظ التلقائي ----------
function updateSaveStatus(ok){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  el.textContent = ok ? `✅ محفوظ تلقائياً (${time})` : '⚠ تعذّر الحفظ التلقائي';
  el.style.color = ok ? 'var(--green-deep)' : 'var(--red)';
}

// ---------- سجل التدقيق (Audit Log) ----------
const AUDIT_LABELS = {
  worker_add: 'إضافة عامل', worker_edit: 'تعديل عامل', worker_delete: 'حذف عامل',
  leave_add: 'تسجيل عطلة', leave_delete: 'حذف عطلة',
  settings_edit: 'تعديل الإعدادات', login: 'تسجيل دخول', logout: 'تسجيل خروج',
  backup_export: 'تصدير نسخة احتياطية', backup_restore: 'استعادة نسخة احتياطية',
  csv_export: 'تصدير CSV', credentials_edit: 'تغيير بيانات الدخول'
};

async function initAuditLog(){
  if(!dbReady) return;
  try{
    const count = await db.auditLog.count();
    if(count === 0){
      const seed = getEmbeddedSeed();
      const embeddedAudit = Array.isArray(seed.auditLog) ? seed.auditLog : [];
      if(embeddedAudit.length){
        await db.auditLog.bulkAdd(embeddedAudit.map(e => ({ timestamp: e.timestamp, action: e.action, details: e.details, user: e.user })));
      }
    }
  }catch(e){ console.error('تعذّر تهيئة سجل التدقيق', e); }
}

async function logAudit(action, details){
  const entry = { timestamp: new Date().toISOString(), action, details, user: (authCredentials && authCredentials.username) || '' };
  if(dbReady){
    try{ await db.auditLog.add(entry); }catch(e){ console.error('audit log error', e); }
  }
}

async function getFullAuditLog(){
  if(dbReady){
    try{ return (await db.auditLog.orderBy('timestamp').reverse().toArray()); }
    catch(e){ console.error(e); }
  }
  return [];
}

const LEAVE_TYPES = {

const DEFAULT_SETTINGS = {

const ALGERIAN_MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const OFFICIAL_CHECK = {
  annual: 'سنوية', exceptional: 'استثنائية', unpaid: 'بدون راتب',
  sick: 'استثنائية', maternity: 'استثنائية', other: 'استثنائية'
};
const OFFICIAL_OPTIONS = ['سنوية','تعويضية','استثنائية','بدون راتب','استرجاع'];

let workers = [];
let leaves = [];
let settings = { ...DEFAULT_SETTINGS };
let authCredentials = null;
let activeWorkerId = null;
let statFilter = ''; // '' | 'all' | 'leave' — تصفية سريعة من بطاقات الإحصائيات
let advFilter = { position: '', status: '' }; // تصفية متقدمة (المسمى الوظيفي / الحالة)

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function loadData(){
  // IndexedDB هو المصدر الوحيد الموثوق دائماً عند توفره
  try{
    const w = await localDB.get('workers');
    workers = JSON.parse(w.value);
  }catch(e){ workers = null; }
  try{
    const l = await localDB.get('leaves');
    leaves = JSON.parse(l.value);
  }catch(e){ leaves = null; }
  try{
    const s = await localDB.get('settings');
    settings = { ...DEFAULT_SETTINGS, ...JSON.parse(s.value) };
  }catch(e){ settings = null; }

  // إن كانت قاعدة IndexedDB فارغة تماماً (أول فتح لهذا الملف على هذا الجهاز)
  // نستخدم البذرة المضمّنة داخل الملف كنقطة انطلاق لمرة واحدة فقط
  if(workers === null && leaves === null && settings === null){
    const seed = getEmbeddedSeed();
    workers = Array.isArray(seed.workers) ? seed.workers : [];
    leaves = Array.isArray(seed.leaves) ? seed.leaves : [];
    settings = { ...DEFAULT_SETTINGS, ...(seed.settings || {}) };
  } else {
    workers = workers || [];
    leaves = leaves || [];
    settings = settings || { ...DEFAULT_SETTINGS };
  }
  if(workers.length === 0){
    workers = SEED_WORKERS.map(w => ({
      id: uid(), name: w.name, position: w.position, hireDate: '', workingHours: '', annualBalance: DEFAULT_ANNUAL_BALANCE
    }));
  }
  await saveWorkers();
  await saveLeaves();
  await saveSettings();
  await initAuditLog();
  render();
}
async function saveWorkers(){
  const r = await localDB.set('workers', JSON.stringify(workers));
  updateSaveStatus(!!r);
}
async function saveLeaves(){
  const r = await localDB.set('leaves', JSON.stringify(leaves));
  updateSaveStatus(!!r);
}
async function saveSettings(){
  const r = await localDB.set('settings', JSON.stringify(settings));
  updateSaveStatus(!!r);
}

function daysBetween(start, end){
  const s = new Date(start), e = new Date(end);
  const diff = Math.round((e - s) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}
function isOnLeaveToday(workerId){
  const t = todayStr();
  return leaves.some(l => l.workerId === workerId && l.startDate <= t && l.endDate >= t);
}
function currentLeaveOf(workerId){
  const t = todayStr();
  return leaves.find(l => l.workerId === workerId && l.startDate <= t && l.endDate >= t) || null;
}
function usedAnnualDays(workerId){
  return leaves.filter(l => l.workerId === workerId && l.type === 'annual')
               .reduce((sum,l) => sum + l.days, 0);
}
function remainingBalance(worker){
  return worker.annualBalance - usedAnnualDays(worker.id);
}
function nextLeaveOf(workerId){
  const t = todayStr();
  return leaves.filter(l => l.workerId === workerId && l.startDate > t)
               .sort((a,b) => a.startDate.localeCompare(b.startDate))[0] || null;
}
function lastLeaveOf(workerId){
  const t = todayStr();
  return leaves.filter(l => l.workerId === workerId && l.endDate < t)
               .sort((a,b) => b.endDate.localeCompare(a.endDate))[0] || null;
}
function initials(name){
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0] || '') + (parts[1]?.[0] || '');
}

function render(){
  renderTopStats();
  populateFilterPositions();
  renderWorkerList();
  renderMain();
  updateNotifBadge();
}

function renderTopStats(){
  const total = workers.length;
  const onLeave = workers.filter(w => isOnLeaveToday(w.id)).length;
  const monthStart = todayStr().slice(0,7);
  const thisMonth = leaves.filter(l => l.startDate.slice(0,7) === monthStart || l.endDate.slice(0,7) === monthStart).length;
  document.getElementById('topStats').innerHTML = `
    <div class="stat-pill ${statFilter==='all'?'active-filter':''}" data-stat="all" title="عرض جميع العمال"><b>${total}</b><span>إجمالي العمال</span></div>
    <div class="stat-pill ${statFilter==='leave'?'active-filter':''}" data-stat="leave" title="عرض العمال في عطلة فقط"><b>${onLeave}</b><span>في عطلة الآن</span></div>
    <div class="stat-pill" data-stat="none" title="عطل هذا الشهر (إعلامي فقط)"><b>${thisMonth}</b><span>عطل هذا الشهر</span></div>
  `;
  document.querySelectorAll('.stat-pill[data-stat]').forEach(el => {
    el.addEventListener('click', () => {
      const s = el.dataset.stat;
      if(s === 'none') return;
      statFilter = (statFilter === s) ? '' : s;
      renderWorkerList();
      renderTopStats();
    });
  });
}

function populateFilterPositions(){
  const sel = document.getElementById('filterPosition');
  if(!sel) return;
  const current = sel.value;
  const positions = Array.from(new Set(workers.map(w => (w.position||'').trim()).filter(Boolean))).sort();
  sel.innerHTML = `<option value="">الكل</option>` + positions.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  if(positions.includes(current)) sel.value = current;
}

function renderWorkerList(){
  const q = (document.getElementById('search').value || '').trim();
  const list = document.getElementById('workerList');
  let filtered = workers.filter(w => w.name.includes(q));
  if(advFilter.position) filtered = filtered.filter(w => (w.position||'') === advFilter.position);
  if(advFilter.status === 'present') filtered = filtered.filter(w => !isOnLeaveToday(w.id));
  if(advFilter.status === 'leave') filtered = filtered.filter(w => isOnLeaveToday(w.id));
  if(statFilter === 'leave') filtered = filtered.filter(w => isOnLeaveToday(w.id));
  if(filtered.length === 0){
    list.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);text-align:center;padding:20px 0;">لا يوجد عمال مطابقون للتصفية الحالية.</p>`;
    return;
  }
  list.innerHTML = filtered.map(w => {
    const rem = remainingBalance(w);
    let badgeClass = 'badge-ok', badgeText = rem + ' يوم متبقي';
    if(rem <= 0){ badgeClass='badge-out'; badgeText='الرصيد منتهٍ'; }
    else if(rem <= 5){ badgeClass='badge-low'; badgeText=rem+' أيام متبقية'; }
    const curLeave = currentLeaveOf(w.id);
    const statusHtml = curLeave
      ? `<span class="w-status status-leave">🟠 في عطلة (${(LEAVE_TYPES[curLeave.type]||{}).label||curLeave.type}) — يعود ${formatDMY(addDaysToDateStr(curLeave.endDate,1))}</span>`
      : `<span class="w-status status-present">🟢 حاضر اليوم</span>`;
    return `
    <div class="worker-item ${w.id===activeWorkerId?'active':''} ${curLeave?'on-leave':''}" data-id="${w.id}">
      <div class="w-avatar">${initials(w.name)}</div>
      <div class="w-info">
        <b>${escapeHtml(w.name)}</b>
        <span>${escapeHtml(w.position || '—')}</span>
        ${statusHtml}
      </div>
      <div class="w-badge ${badgeClass}">${badgeText}</div>
      <div class="worker-quick-actions">
        <button type="button" data-quick-edit="${w.id}" title="تعديل البيانات">✏️</button>
        <button type="button" data-quick-leave="${w.id}" title="إضافة عطلة سريعة">➕</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.worker-item').forEach(el => {
    el.addEventListener('click', () => { activeWorkerId = el.dataset.id; render(); });
  });
  list.querySelectorAll('[data-quick-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const w = workers.find(x => x.id === btn.dataset.quickEdit);
      if(w) openWorkerModal(w);
    });
  });
  list.querySelectorAll('[data-quick-leave]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      activeWorkerId = btn.dataset.quickLeave;
      render();
      setTimeout(() => {
        const dateInput = document.getElementById('lvStart');
        if(dateInput) dateInput.focus();
      }, 50);
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMain(){
  const empty = document.getElementById('emptyState');
  const detail = document.getElementById('workerDetail');
  const worker = workers.find(w => w.id === activeWorkerId);
  if(!worker){
    empty.classList.remove('hidden');
    detail.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');
  detail.classList.remove('hidden');

  const rem = remainingBalance(worker);
  const used = usedAnnualDays(worker.id);
  const pct = Math.min(100, Math.max(0, Math.round((used / (worker.annualBalance||1)) * 100)));
  const workerLeaves = leaves.filter(l => l.workerId === worker.id)
                              .sort((a,b) => b.startDate.localeCompare(a.startDate));
  const curLeave = currentLeaveOf(worker.id);
  const statusBannerHtml = curLeave
    ? `<div class="status-banner sb-leave">🟠 في عطلة الآن — ${(LEAVE_TYPES[curLeave.type]||{}).label||curLeave.type} · من ${formatDMY(curLeave.startDate)} إلى ${formatDMY(curLeave.endDate)} · يستأنف العمل بتاريخ ${formatDMY(addDaysToDateStr(curLeave.endDate,1))}</div>`
    : `<div class="status-banner sb-present">🟢 على رأس عمله اليوم</div>`;
  let extraLeaveInfoHtml = '';
  if(!curLeave){
    const nxt = nextLeaveOf(worker.id);
    if(nxt){
      extraLeaveInfoHtml = `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">📅 العطلة القادمة: ${(LEAVE_TYPES[nxt.type]||{}).label||nxt.type} من ${formatDMY(nxt.startDate)} إلى ${formatDMY(nxt.endDate)}</p>`;
    } else {
      const lst = lastLeaveOf(worker.id);
      extraLeaveInfoHtml = lst
        ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">🕓 آخر عطلة: ${(LEAVE_TYPES[lst.type]||{}).label||lst.type} انتهت بتاريخ ${formatDMY(lst.endDate)}</p>`
        : `<p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 14px;">لا توجد عطل سابقة أو قادمة مسجلة.</p>`;
    }
  }

  detail.innerHTML = `
    <div class="worker-head">
      <div class="worker-title">
        <div class="w-avatar">${initials(worker.name)}</div>
        <div>
          <h2>${escapeHtml(worker.name)}</h2>
          <p>${escapeHtml(worker.position || '—')} · التوظيف: ${worker.hireDate || '—'}</p>
        </div>
      </div>
      <div class="head-actions">
        <button id="btnEditWorker">تعديل البيانات</button>
        <button class="danger" id="btnDeleteWorker">حذف العامل</button>
      </div>
    </div>

    ${statusBannerHtml}
    ${extraLeaveInfoHtml}

    <div class="balance-strip">
      <div class="b-card">
        <span>الرصيد السنوي</span>
        <b>${worker.annualBalance} يوم</b>
      </div>
      <div class="b-card">
        <span>الأيام المستخدمة</span>
        <b>${used} يوم</b>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="b-card">
        <span>الرصيد المتبقي</span>
        <b style="color:${rem<=0?'var(--red)':rem<=5?'var(--amber-deep)':'var(--green-deep)'}">${rem} يوم</b>
      </div>
    </div>

    <div class="section-title">
      <span>تسجيل عطلة جديدة</span>
    </div>
    <form class="form-grid" id="leaveForm">
      <div>
        <label>نوع العطلة</label>
        <select id="lvType">
          ${Object.entries(LEAVE_TYPES).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>تاريخ البداية</label>
        <input type="date" id="lvStart" value="${todayStr()}">
      </div>
      <div>
        <label>تاريخ النهاية</label>
        <input type="date" id="lvEnd" value="${todayStr()}">
      </div>
      <div>
        <label>عدد الأيام</label>
        <input type="text" id="lvDaysDisplay" disabled value="1">
      </div>
      <div>
        <label>اسم ولقب المستخلف (اختياري)</label>
        <input type="text" id="lvSubName" placeholder="لملء نموذج طلب العطلة">
      </div>
      <div>
        <label>رتبة المستخلف (اختياري)</label>
        <input type="text" id="lvSubPosition">
      </div>
      <div class="full">
        <label>العنوان أثناء العطلة (اختياري)</label>
        <input type="text" id="lvAddress">
      </div>
      <div class="full">
        <label>ملاحظات (اختياري)</label>
        <input type="text" id="lvNote" placeholder="سبب العطلة أو أي تفاصيل إضافية">
      </div>
      <div class="full error-msg hidden" id="lvError"></div>
      <div class="full form-actions">
        <button type="submit" class="primary">تسجيل العطلة</button>
      </div>
    </form>

    <div class="section-title">
      <span>سجل العطل (${workerLeaves.length})</span>
    </div>
    <div id="leaveHistory">
      ${workerLeaves.length === 0
        ? `<p style="font-size:13px;color:var(--ink-soft);">لا توجد عطل مسجلة لهذا العامل بعد.</p>`
        : workerLeaves.map(l => {
            const t = LEAVE_TYPES[l.type] || LEAVE_TYPES.other;
            return `
            <div class="leave-label">
              <div class="tag ${t.tag}">${t.label}</div>
              <div class="leave-top">
                <span class="leave-dates">${l.startDate} → ${l.endDate}</span>
                <span class="leave-days">${l.days} يوم</span>
              </div>
              ${l.note ? `<div class="leave-note">${escapeHtml(l.note)}</div>` : ''}
              <div class="leave-actions">
                <button data-print-id="${l.id}">🖨 طباعة طلب العطلة</button>
                <button data-print-resume-id="${l.id}">🖨 طباعة استئناف العمل</button>
                <button class="danger" data-leave-id="${l.id}">حذف</button>
              </div>
            </div>`;
          }).join('')
      }
    </div>
  `;

  const startInput = document.getElementById('lvStart');
  const endInput = document.getElementById('lvEnd');
  const daysDisplay = document.getElementById('lvDaysDisplay');
  function updateDays(){
    const d = daysBetween(startInput.value, endInput.value);
    daysDisplay.value = d > 0 ? d : 0;
  }
  startInput.addEventListener('change', updateDays);
  endInput.addEventListener('change', updateDays);
  updateDays();

  document.getElementById('leaveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('lvError');
    errEl.classList.add('hidden');
    const type = document.getElementById('lvType').value;
    const start = startInput.value;
    const end = endInput.value;
    const note = document.getElementById('lvNote').value.trim();
    const substituteName = document.getElementById('lvSubName').value.trim();
    const substitutePosition = document.getElementById('lvSubPosition').value.trim();
    const address = document.getElementById('lvAddress').value.trim();
    const days = daysBetween(start, end);
    if(!start || !end){
      errEl.textContent = 'يرجى تحديد تاريخ البداية والنهاية.';
      errEl.classList.remove('hidden');
      return;
    }
    if(days <= 0){
      errEl.textContent = 'تاريخ النهاية يجب أن يكون بعد تاريخ البداية أو يساويه.';
      errEl.classList.remove('hidden');
      return;
    }
    leaves.push({ id: uid(), workerId: worker.id, type, startDate: start, endDate: end, days, note, substituteName, substitutePosition, address, createdAt: Date.now() });
    await saveLeaves();
    await logAudit('leave_add', `تسجيل عطلة (${(LEAVE_TYPES[type]||{}).label||type}) للعامل "${worker.name}" من ${start} إلى ${end} (${days} يوم)`);
    render();
  });

  document.getElementById('leaveHistory').querySelectorAll('[data-print-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const leave = leaves.find(l => l.id === btn.dataset.printId);
      if(leave) printLeaveRequest(leave, worker);
    });
  });

  document.getElementById('leaveHistory').querySelectorAll('[data-print-resume-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const leave = leaves.find(l => l.id === btn.dataset.printResumeId);
      if(leave) printResumptionRequest(leave, worker);
    });
  });

  document.getElementById('leaveHistory').querySelectorAll('[data-leave-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lv = leaves.find(l => l.id === btn.dataset.leaveId);
      leaves = leaves.filter(l => l.id !== btn.dataset.leaveId);
      await saveLeaves();
      if(lv) await logAudit('leave_delete', `حذف عطلة (${(LEAVE_TYPES[lv.type]||{}).label||lv.type}) للعامل "${worker.name}" من ${lv.startDate} إلى ${lv.endDate}`);
      render();
    });
  });

  document.getElementById('btnEditWorker').addEventListener('click', () => openWorkerModal(worker));
  document.getElementById('btnDeleteWorker').addEventListener('click', () => openDeleteConfirm(worker));
}

function openWorkerModal(worker){
  const isEdit = !!worker;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>${isEdit ? 'تعديل بيانات العامل' : 'إضافة عامل جديد'}</h3>
        <form id="workerForm">
          <label>الاسم الكامل</label>
          <input id="wfName" type="text" value="${isEdit ? escapeHtml(worker.name) : ''}" style="margin-bottom:12px;">
          <label>المنصب</label>
          <input id="wfPosition" type="text" value="${isEdit ? escapeHtml(worker.position||'') : ''}" placeholder="صيدلي، مساعد صيدلي..." style="margin-bottom:12px;">
          <label>تاريخ التوظيف</label>
          <input id="wfHireDate" type="date" value="${isEdit ? (worker.hireDate||'') : ''}" style="margin-bottom:12px;">
          <label>توقيت العمل الخاص بهذا العامل (اختياري)</label>
          <input id="wfHours" type="text" value="${isEdit ? escapeHtml(worker.workingHours||'') : ''}" placeholder="${escapeHtml(settings.workingHours)}" style="margin-bottom:4px;">
          <p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 12px;">اتركه فارغاً لاستخدام توقيت العمل الافتراضي من الإعدادات.</p>
          <label>الرصيد السنوي (بالأيام)</label>
          <input id="wfBalance" type="number" min="0" value="${isEdit ? worker.annualBalance : DEFAULT_ANNUAL_BALANCE}" style="margin-bottom:12px;">
          <div class="error-msg hidden" id="wfError"></div>
          <div class="form-actions">
            <button type="submit" class="primary">${isEdit ? 'حفظ التعديلات' : 'إضافة العامل'}</button>
            <button type="button" id="wfCancel">إلغاء</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('workerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('wfName').value.trim();
    const position = document.getElementById('wfPosition').value.trim();
    const hireDate = document.getElementById('wfHireDate').value;
    const workingHours = document.getElementById('wfHours').value.trim();
    const balance = parseFloat(document.getElementById('wfBalance').value);
    const errEl = document.getElementById('wfError');
    if(!name){
      errEl.textContent = 'يرجى إدخال اسم العامل.';
      errEl.classList.remove('hidden');
      return;
    }
    if(isNaN(balance) || balance < 0){
      errEl.textContent = 'يرجى إدخال رصيد سنوي صحيح.';
      errEl.classList.remove('hidden');
      return;
    }
    if(isEdit){
      worker.name = name; worker.position = position; worker.hireDate = hireDate; worker.workingHours = workingHours; worker.annualBalance = balance;
    } else {
      const w = { id: uid(), name, position, hireDate, workingHours, annualBalance: balance };
      workers.push(w);
      activeWorkerId = w.id;
    }
    await saveWorkers();
    await logAudit(isEdit ? 'worker_edit' : 'worker_add', isEdit ? `تعديل بيانات العامل "${name}"` : `إضافة عامل جديد "${name}"`);
    closeModal();
    render();
  });
}

function openDeleteConfirm(worker){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>حذف العامل</h3>
        <p style="font-size:14px;color:var(--ink-soft);margin-bottom:18px;">
          هل أنت متأكد من حذف "${escapeHtml(worker.name)}"؟ سيتم حذف جميع سجلات عطله أيضاً. لا يمكن التراجع عن هذا الإجراء.
        </p>
        <div class="form-actions">
          <button class="danger" id="confirmDelete">حذف نهائياً</button>
          <button id="wfCancel">إلغاء</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('confirmDelete').addEventListener('click', async () => {
    workers = workers.filter(w => w.id !== worker.id);
    leaves = leaves.filter(l => l.workerId !== worker.id);
    activeWorkerId = null;
    await saveWorkers();
    await saveLeaves();
    await logAudit('worker_delete', `حذف العامل "${worker.name}" وجميع سجلات عطله`);
    closeModal();
    render();
  });
}

function formatDMY(dateStr){
  if(!dateStr) return '..............';
  const d = new Date(dateStr + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function addDaysToDateStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function printLeaveRequest(leave, worker){
  const isParamedical = /تمريض/.test(worker.position);
  const checked = OFFICIAL_CHECK[leave.type] || 'استثنائية';
  const checkboxesHtml = OFFICIAL_OPTIONS.map(opt =>
    `<div class="chk"><div class="box">${opt === checked ? '<span>X</span>' : ''}</div><span>${opt}</span></div>`
  ).join('');
  const returnDate = formatDMY(addDaysToDateStr(leave.endDate, 1));

  const signRowsHtml = isParamedical
    ? `<div class="sign-row">
         <div class="sign-box">المعني</div>
         <div class="sign-box">المستخلف</div>
         <div class="sign-box">منسق النشاطات الشبه الطبية</div>
       </div>

function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function monthRangeStr(year, month){
  const mm = String(month).padStart(2,'0');
  const start = `${year}-${mm}-01`;
  const end = `${year}-${mm}-${String(daysInMonth(year,month)).padStart(2,'0')}`;
  return { start, end };
}

function scheduleNoteForWorker(workerId, year, month){
  const { start, end } = monthRangeStr(year, month);
  const overlapping = leaves.filter(l => l.workerId === workerId && l.startDate <= end && l.endDate >= start)
                             .sort((a,b) => a.startDate.localeCompare(b.startDate));
  if(overlapping.length === 0) return '';
  const mName = ALGERIAN_MONTHS[month-1];
  return overlapping.map(l => {
    const t = (LEAVE_TYPES[l.type] && LEAVE_TYPES[l.type].label) || 'استثنائية';
    const startsInMonth = l.startDate >= start;
    const endsInMonth = l.endDate <= end;
    const sDay = parseInt(l.startDate.slice(8,10), 10);
    const eDay = parseInt(l.endDate.slice(8,10), 10);
    if(startsInMonth && endsInMonth) return `عطلة ${t} من ${sDay} إلى ${eDay} ${mName}`;
    if(startsInMonth && !endsInMonth) return `عطلة ${t} ابتداءً من ${sDay} ${mName}`;
    if(!startsInMonth && endsInMonth) return `عطلة ${t} إلى غاية ${eDay} ${mName}`;
    return `عطلة ${t} طيلة الشهر`;
  }).join(' — ');
}

// ---------- جدول المناوبة (الجمعة والسبت) ----------
function getWeekendDatesInMonth(year, month){
  const n = daysInMonth(year, month);
  const dates = [];
  for(let d = 1; d <= n; d++){
    const wd = new Date(year, month - 1, d).getDay(); // 0=Sunday ... 5=Friday, 6=Saturday
    if(wd === 5 || wd === 6){
      dates.push({ day: d, label: wd === 5 ? 'الجمعة' : 'السبت' });
    }
  }
  return dates;
}

function buildDutyDatesFields(year, month){
  const dates = getWeekendDatesInMonth(year, month);
  if(dates.length === 0){
    return '<p style="font-size:13px;color:var(--ink-soft);margin:4px 0;">لا توجد أيام جمعة أو سبت ضمن هذا الشهر.</p>';
  }
  if(workers.length === 0){
    return '<p style="font-size:13px;color:var(--ink-soft);margin:4px 0;">لا يوجد عمال مسجلون.</p>';
  }
  return dates.map(d => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <span style="flex:0 0 110px;font-size:12.5px;">${d.day} (${d.label})</span>
      <select class="duty-day-select" data-day="${d.day}" style="flex:1;padding:6px 8px;font-size:12.5px;">
        <option value="">-- بدون تعيين --</option>
        ${workers.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}
      </select>
    </div>`).join('');
}

// ---------- التنبيهات ----------
function computeNotifications(){
  const notifs = [];
  const t = todayStr();
  const in7 = addDaysToDateStr(t, 7);
  leaves.forEach(l => {
    if(l.startDate > t && l.startDate <= in7){
      const w = workers.find(x => x.id === l.workerId);
      if(w){
        notifs.push({ type: 'upcoming', text: `عطلة ${(LEAVE_TYPES[l.type]||{}).label||l.type} للعامل "${w.name}" تبدأ بتاريخ ${formatDMY(l.startDate)}` });
      }
    }
  });
  for(let i=0;i<leaves.length;i++){
    for(let j=i+1;j<leaves.length;j++){
      const a = leaves[i], b = leaves[j];
      if(a.workerId === b.workerId) continue;
      const wa = workers.find(x=>x.id===a.workerId);
      const wb = workers.find(x=>x.id===b.workerId);
      if(!wa || !wb || !wa.position || wa.position !== wb.position) continue;
      if(a.startDate <= b.endDate && b.startDate <= a.endDate){
        notifs.push({ type: 'overlap', text: `تداخل عطل: "${wa.name}" و"${wb.name}" (${wa.position}) في نفس الفترة` });
      }
    }
  }
  return notifs;
}
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const n = computeNotifications();
  if(n.length === 0){ badge.classList.add('hidden'); }
  else{ badge.textContent = n.length > 9 ? '9+' : String(n.length); badge.classList.remove('hidden'); }
}

function formatAuditTime(iso){
  try{
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }catch(e){ return iso || ''; }
}

// ---------- تنزيل ملف نصي مساعد ----------
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function toCsvValue(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCsv(headers, rows){
  const lines = [headers.map(toCsvValue).join(',')];
  rows.forEach(r => lines.push(r.map(toCsvValue).join(',')));
  return '\uFEFF' + lines.join('\r\n'); // BOM لدعم صحيح للعربية في إكسل
}

async function handleRestoreFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.workers) || !Array.isArray(data.leaves)){
      alert('ملف النسخة الاحتياطية غير صالح أو تالف.');
      return;
    }
    if(!confirm(`سيتم استبدال البيانات الحالية بالكامل بـ ${data.workers.length} عامل و ${data.leaves.length} سجل عطلة من النسخة الاحتياطية. هل تريد المتابعة؟`)){
      return;
    }
    workers = data.workers;
    leaves = data.leaves;
    settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
    await saveWorkers();
    await saveLeaves();
    await saveSettings();
    if(Array.isArray(data.auditLog) && data.auditLog.length && dbReady){
      try{ await db.auditLog.bulkAdd(data.auditLog.map(a => ({ timestamp:a.timestamp, action:a.action, details:a.details, user:a.user }))); }catch(err){}
    }
    await logAudit('backup_restore', `استعادة نسخة احتياطية (${workers.length} عامل، ${leaves.length} سجل عطلة)`);
    closeModal();
    render();
    alert('تمت استعادة البيانات بنجاح.');
  }catch(err){
    console.error(err);
    alert('تعذّرت قراءة ملف النسخة الاحتياطية.');
  }
}

// ---------- تسجيل الدخول ----------
async function hashText(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // احتياط بسيط في حال عدم توفر SubtleCrypto
    let h = 0;
    for(let i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; }
    return 'fallback_' + h;
  }
}

async function getStoredCredentials(){
  try{
    const r = await localDB.get('auth_credentials');
    authCredentials = JSON.parse(r.value);
    return authCredentials;
  }catch(e){
    // أول فتح لهذا الملف على هذا الجهاز: تحقق من البذرة المضمّنة إن وُجدت
    const seed = getEmbeddedSeed();
    if(seed && seed.auth){
      authCredentials = seed.auth;
      try{ await localDB.set('auth_credentials', JSON.stringify(seed.auth)); }catch(err){}
      return authCredentials;
    }
    // لا يوجد أي حساب مسجل بعد: إنشاء حساب افتراضي (admin / admin) تلقائياً.
    // يمكن تغيير اسم المستخدم وكلمة السر لاحقاً من داخل البرنامج عبر زر "🔑 تغيير بيانات الدخول".
    const defaultHash = await hashText('admin');
    const defaultCred = { username: 'admin', passwordHash: defaultHash };
    authCredentials = defaultCred;
    try{ await localDB.set('auth_credentials', JSON.stringify(defaultCred)); }catch(err){}
    return defaultCred;
  }
}
async function saveCredentials(cred){
  authCredentials = cred;
  try{ await localDB.set('auth_credentials', JSON.stringify(cred)); }
  catch(e){ console.error('auth storage error', e); }
}
async function deleteCredentialsLocal(){
  authCredentials = null;
  try{ await localDB.delete('auth_credentials'); }catch(e){}
}

function openChangeCredentialsModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>🔑 تغيير بيانات الدخول</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;">أدخل كلمة السر الحالية، ثم حدد اسم المستخدم وكلمة السر الجديدين.</p>
        <form id="credsForm">
          <label>كلمة السر الحالية</label>
          <input id="ccCurrentPass" type="password" autocomplete="current-password" style="margin-bottom:12px;" required>
          <label>اسم المستخدم الجديد</label>
          <input id="ccNewUser" type="text" autocomplete="username" value="${escapeHtml((authCredentials && authCredentials.username) || '')}" style="margin-bottom:12px;" required>
          <label>كلمة السر الجديدة</label>
          <input id="ccNewPass" type="password" autocomplete="new-password" style="margin-bottom:12px;" required>
          <label>تأكيد كلمة السر الجديدة</label>
          <input id="ccNewPass2" type="password" autocomplete="new-password" style="margin-bottom:12px;" required>
          <div class="error-msg hidden" id="ccError"></div>
          <div class="form-actions">
            <button type="submit" class="primary">حفظ التغييرات</button>
            <button type="button" id="wfCancel">إلغاء</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('wfCancel').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', (e) => { if(e.target.id==='modalBack') closeModal(); });
  document.getElementById('credsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('ccError');
    errEl.classList.add('hidden');
    const currentPass = document.getElementById('ccCurrentPass').value;
    const newUser = document.getElementById('ccNewUser').value.trim();
    const newPass = document.getElementById('ccNewPass').value;
    const newPass2 = document.getElementById('ccNewPass2').value;

    const currentHash = await hashText(currentPass);
    if(!authCredentials || currentHash !== authCredentials.passwordHash){
      errEl.textContent = 'كلمة السر الحالية غير صحيحة.';
      errEl.classList.remove('hidden');
      return;
    }
    if(!newUser){
      errEl.textContent = 'يرجى إدخال اسم مستخدم جديد.';
      errEl.classList.remove('hidden');
      return;
    }
    if(newPass.length < 4){
      errEl.textContent = 'يجب أن تتكون كلمة السر الجديدة من 4 أحرف على الأقل.';
      errEl.classList.remove('hidden');
      return;
    }
    if(newPass !== newPass2){
      errEl.textContent = 'كلمتا السر الجديدتان غير متطابقتين.';
      errEl.classList.remove('hidden');
      return;
    }
    const newHash = await hashText(newPass);
    await saveCredentials({ username: newUser, passwordHash: newHash });
    await logAudit('credentials_edit', `تغيير اسم المستخدم وكلمة السر (المستخدم الجديد: "${newUser}")`);
    closeModal();
    alert('تم تغيير بيانات الدخول بنجاح. استخدمها في المرة القادمة لتسجيل الدخول.');
  });
}

function renderSetupScreen(){
  const card = document.getElementById('authCard');
  card.innerHTML = `
    <h2>🔒 إنشاء حساب الدخول</h2>
    <p class="sub">لا يوجد حساب مسجل بعد على هذا الجهاز. أنشئ اسم مستخدم وكلمة سر للدخول إلى برنامج إدارة عطل عمال الصيدلية.</p>
    <form id="setupForm">
      <label>اسم المستخدم</label>
      <input id="setUser" type="text" autocomplete="username" required>
      <label>كلمة السر</label>
      <input id="setPass" type="password" autocomplete="new-password" required>
      <label>تأكيد كلمة السر</label>
      <input id="setPass2" type="password" autocomplete="new-password" required>
      <p class="error-msg hidden" id="setError"></p>
      <button type="submit" class="primary">إنشاء الحساب والدخول</button>
    </form>
  `;
  document.getElementById('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('setUser').value.trim();
    const pass = document.getElementById('setPass').value;
    const pass2 = document.getElementById('setPass2').value;
    const errEl = document.getElementById('setError');
    if(!user || !pass){
      errEl.textContent = 'يرجى تعبئة جميع الحقول.';
      errEl.classList.remove('hidden');
      return;
    }
    if(pass.length < 4){
      errEl.textContent = 'يجب أن تتكون كلمة السر من 4 أحرف على الأقل.';
      errEl.classList.remove('hidden');
      return;
    }
    if(pass !== pass2){
      errEl.textContent = 'كلمتا السر غير متطابقتين.';
      errEl.classList.remove('hidden');
      return;
    }
    const passwordHash = await hashText(pass);
    await saveCredentials({ username: user, passwordHash });
    await enterApp();
  });
}

function renderLoginScreen(stored){
  const card = document.getElementById('authCard');
  card.innerHTML = `
    <h2>🔒 تسجيل الدخول</h2>
    <p class="sub">برنامج إدارة عطل عمال الصيدلية</p>
    <form id="loginForm">
      <label>اسم المستخدم</label>
      <input id="logUser" type="text" autocomplete="username" required>
      <label>كلمة السر</label>
      <input id="logPass" type="password" autocomplete="current-password" required>
      <p class="error-msg hidden" id="logError"></p>
      <button type="submit" class="primary">دخول</button>
    </form>
    <p class="auth-switch">نسيت كلمة السر؟ <a id="resetAccountLink">إعادة تعيين الحساب</a></p>
    <p style="font-size:11px;color:var(--ink-soft);text-align:center;margin-top:10px;">الحساب الافتراضي عند أول استخدام: <b>admin / admin</b> (قابل للتغيير من داخل البرنامج بعد الدخول)</p>
  `;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value;
    const errEl = document.getElementById('logError');
    const passwordHash = await hashText(pass);
    if(user !== stored.username || passwordHash !== stored.passwordHash){
      errEl.textContent = 'اسم المستخدم أو كلمة السر غير صحيحة.';
      errEl.classList.remove('hidden');
      return;
    }
    await enterApp();
  });
  document.getElementById('resetAccountLink').addEventListener('click', async () => {
    if(confirm('سيؤدي هذا إلى حذف اسم المستخدم وكلمة السر الحاليين فقط (دون التأثير على بيانات العمال والعطل)، ثم إنشاء حساب جديد. هل تريد المتابعة؟')){
      await deleteCredentialsLocal();
      renderSetupScreen();
    }
  });
}

async function enterApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  await loadData();
  await logAudit('login', `تسجيل دخول المستخدم "${(authCredentials && authCredentials.username) || ''}"`);
}

async function logoutApp(){
  // حفظ جميع التعديلات الحالية قبل الخروج
  await saveWorkers();
  await saveLeaves();
  await saveSettings();
  await logAudit('logout', `تسجيل خروج المستخدم "${(authCredentials && authCredentials.username) || ''}"`);
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  const stored = await getStoredCredentials();
  if(stored) renderLoginScreen(stored); else renderSetupScreen();
}

async function initAuth(){
  const stored = await getStoredCredentials();
  if(stored) renderLoginScreen(stored); else renderSetupScreen();
}

initAuth();
</script>
</body>
